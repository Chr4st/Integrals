[data]
total_pairs = 200_000_000
train_ratio = 0.8
seed = 42

[model.tree_gnn]
node_dim = 256
message_rounds = 8
decoder_levels = 8
n_heads = 8
pe_type = "none"  # "none" | "depth_index" | "rwse" | "laplacian"

[inference.mcts]
n_simulations = 100
puct_c = 1.4
max_depth = 10
cache_size = 100000

[training.curriculum]
type = "static"  # "static" | "competence" | "self_paced"
c_0 = 0.1
self_paced_start = 0.3

[training]
batch_size = 256
lr = 3e-4
weight_decay = 0.01
epochs = 90
patience = 15
n_samples = 25
temperature = 0.7
top_p = 0.95
grad_clip = 1.0
